name: Publish Agenthon image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out participant agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out pinned public Track 4 fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Agenthon-2026/track4-analysis-public
          ref: ede7381d8c1ba9d8c84068f9d142f5e093a33892
          path: .upstream

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned test tools and published answer schema
        run: |
          python -m pip install "pytest==9.1.1" "jsonschema==4.26.0"
          python -m pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@50fb2dc2b39c70f4cf81fcd269943782eddfaed0#subdirectory=common"

      - name: Test runtime and all public units over real HTTP
        env:
          T4_UPSTREAM_PATH: ${{ github.workspace }}/.upstream
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest tests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/amd64 image locally
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/optivex-t4-agent:dev
          provenance: false
          sbom: false

      - name: Verify image contract and restricted mock smoke
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/optivex-t4-agent:dev
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "qfbench2.interface_version" }}')" = 2.0
          docker run --rm "$IMAGE" analyze --help
          mkdir -p smoke-output
          chmod 0777 smoke-output
          cpu_limit="$(python -c 'import os; print(min(16, os.cpu_count() or 1))')"
          # Restrictive smoke: these are cgroup ceilings, not a claim that the
          # hosted runner has the organizer's 16 CPUs or 128 GiB of physical RAM.
          docker run --rm \
            --read-only --user 65534:65534 --cap-drop=ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --pids-limit 256 --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --cpus "$cpu_limit" --memory 128g --memory-swap 128g \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/.upstream/units/t4-EXAMPLE-eps-beat:/input:ro" \
            -v "$PWD/smoke-output:/output" \
            "$IMAGE" analyze --mock \
            --task /input/task.json \
            --corpus /input/corpus \
            --out /output/answer.json
          python -m json.tool smoke-output/answer.json >/dev/null

      - name: Test built container over real HTTP under restricted runtime
        env:
          T4_TEST_IMAGE: ghcr.io/${{ github.repository_owner }}/optivex-t4-agent:dev
          T4_UPSTREAM_PATH: ${{ github.workspace }}/.upstream
          PYTHONDONTWRITEBYTECODE: "1"
        # The local server is a protocol fixture with canned predictions, not a
        # House-model quality benchmark. Docker uses host networking to reach it.
        # This does not reproduce or verify the organizer's outbound firewall.
        run: >-
          python -m pytest tests/test_http_runtime.py
          tests/test_citation_context.py::test_cli_wires_original_table_metadata_without_additional_model_requests
          -q

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and record immutable digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/optivex-t4-agent:dev
        run: |
          docker push "$IMAGE"
          reference="$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')"
          digest="${reference##*@}"
          test "${digest#sha256:}" != "$digest"
          test "${#digest}" -eq 71
          printf '%s\n' "$digest" | tee image-digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest
          path: image-digest.txt
